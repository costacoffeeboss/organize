name: OTA update (EAS Update)

# Every push to master publishes the JS over the air to the "preview"
# channel — your own test build on your phone, NOT the public. Try the
# change there first, then run the "Promote OTA to production" workflow
# to release it to everyone on the App Store.

on:
  push:
    branches: [master]
    paths-ignore:
      - "landing/**"
      - "**.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish update to preview
        run: eas update --channel preview --message "$(git log -1 --pretty=%s)" --non-interactive
